<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قائمة الطعام</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- الشريط العلوي -->
  <header class="nav">
    <div class="container">
      <div class="brand">
        <img id="navLogo" class="brand-logo" src="" alt="الشعار" />
        <div class="brand-text">
          <div class="brand-name" id="navName">مطعم الذواقة</div>
          <div class="brand-slogan" id="navSlogan"></div>
        </div>
      </div>
      <a class="nav-phone" id="navPhone" href="#" dir="ltr">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span class="txt" id="navPhoneTxt"></span>
      </a>
    </div>
  </header>

  <!-- الواجهة -->
  <section class="hero">
    <div class="container hero-inner">
      <div class="hero-badge">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h19"/><path d="M11.25 22a.75.75 0 0 0 .75-.75V3.75a.75.75 0 0 0-1.5 0v17.5c0 .414.336.75.75.75z"/><path d="M21 11V7.5a2.5 2.5 0 0 0-2.5-2.5H13"/></svg>
        قائمة الطعام
      </div>
      <h1 class="hero-title">مرحباً بكم في <span id="heroName">مطعم الذواقة</span></h1>
      <p class="hero-sub" id="heroSlogan"></p>
      <div class="hero-line"></div>
    </div>
  </section>

  <!-- زر تصفح الأقسام -->
  <div class="cats">
    <div class="container">
      <nav class="cats-row" id="catsRow"></nav>
    </div>
  </div>

  <!-- الأصناف -->
  <main class="container" id="menuRoot"></main>

  <!-- نافذة عرض طبق -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <img class="modal-img" id="modalImg" src="" alt="" />
      <h3 id="modalTitle"></h3>
      <div class="modal-price" id="modalPrice"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-actions">
        <a class="btn-call" id="modalCall" href="#" dir="ltr">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          اطلب عبر واتساب
        </a>
        <button class="btn-close" id="modalClose">إغلاق</button>
      </div>
    </div>
  </div>

  <!-- التذييل -->
  <footer class="footer">
    <div class="container">
      <div class="footer-info">
        <strong id="footName"></strong>
        <span id="footAddress"></span>
        <span dir="ltr" id="footPhone"></span>
      </div>
      <div class="footer-info">
        <span>ساعات العمل: يومياً من 8 صباحاً حتى 12 منتصف الليل</span>
        <a class="footer-admin" id="footAdmin" href="admin.html">لوحة تحكم الإدارة</a>
      </div>
    </div>
  </footer>

  <script src="libs/xlsx.full.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
